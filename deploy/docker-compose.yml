# Production-shaped stack. Build the frontend first:  (cd frontend && npm ci && npm run build)
name: tidewatch

services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      TIDEWATCH_ENV: prod
      TIDEWATCH_MODE: ${TIDEWATCH_MODE:-demo}
      TIDEWATCH_ALLOWED_ORIGINS: '["https://${TIDEWATCH_DOMAIN:?set TIDEWATCH_DOMAIN}"]'
      TIDEWATCH_ALLOWED_HOSTS: '["${TIDEWATCH_DOMAIN}"]'
      # Per-IP ticket rate. Default = the app default (10/min). Only the CI browser tests raise it,
      # because every test page shares one client IP; never raise it for a public deployment.
      TIDEWATCH_TICKET_RATE_PER_MINUTE: ${TIDEWATCH_TICKET_RATE_PER_MINUTE:-10}
      # TIDEWATCH_API_KEYS is injected from the host environment / secret manager in live mode.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    networks: [internal]
    # NOTE: no `ports:` - the backend is never published to the host.
    healthcheck:
      # Sends the configured Host: 127.0.0.1 is (deliberately) not in the TrustedHost allowlist.
      test: ["CMD", "python", "-c", "import json, os, urllib.request as u; host = json.loads(os.environ['TIDEWATCH_ALLOWED_HOSTS'])[0]; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'Host': host}), timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s

  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      TIDEWATCH_DOMAIN: ${TIDEWATCH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - caddy_data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, public]

networks:
  # backend + caddy only. internal: no route to the outside world, so the backend has no egress
  # (demo mode needs none). M5 live adapters must add a dedicated egress network, not remove this.
  internal:
    internal: true
  public: {}

volumes:
  caddy_data: {}
