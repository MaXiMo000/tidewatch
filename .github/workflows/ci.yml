name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: bandit -q -r app -c pyproject.toml
      - run: pip-audit
      # Audit the hash-pinned lock that actually ships in the Docker image, not just the dev venv.
      - run: pip-audit --disable-pip --require-hashes -r requirements.lock
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: dependency install scripts never run in CI (supply-chain hardening)
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle # docs/PERFORMANCE.md: initial JS <= 350 KB gzip
      - run: npm audit --omit=dev --audit-level=high

  # Builds the image from the hash-pinned lock and smoke-tests the production-shaped stack over
  # HTTPS (Caddy local CA): headers, WebSocket auth, backend unreachable except through Caddy.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build frontend
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Start stack
        working-directory: deploy
        env:
          TIDEWATCH_DOMAIN: localhost
          # Test pages all share one client IP; the production default stays 10/min.
          TIDEWATCH_TICKET_RATE_PER_MINUTE: "120"
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke test
        env:
          TIDEWATCH_DOMAIN: localhost
        run: |
          pip install --require-hashes --no-deps -r backend/requirements.lock
          docker compose -f deploy/docker-compose.yml cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/ca.crt"
          python scripts/smoke_compose.py --ca "$RUNNER_TEMP/ca.crt"
      # Real browser against the real stack: zero CSP violations/console errors, live data, a
      # rendered scene on every quality tier, keyboard-operable tier control, reduced motion.
      # Uses the runner's installed Chrome (channel), so no browser binaries are downloaded.
      - name: Browser E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
          E2E_CHANNEL: chrome
        run: npm run e2e
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        env:
          TIDEWATCH_DOMAIN: localhost
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        working-directory: deploy
        env:
          TIDEWATCH_DOMAIN: localhost
        run: docker compose down --volumes

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
